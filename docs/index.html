<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taurine — Don't let your Mac fall asleep</title>
<meta name="description" content="A tiny menu bar app that keeps your Mac awake, even with the lid closed.">
<link rel="icon" href="img/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <section class="hero">
    <div class="wrap">
      <div class="menubar" role="img" aria-label="macOS menu bar with the Taurine icon">
        <button id="can" class="can is-active" aria-pressed="true" aria-label="Toggle Taurine"></button>
        <span class="mb-spacer"></span>
        <span class="mb-item">80%</span>
        <span class="mb-item">Fri 11 Sep</span>
        <span class="mb-item">00:08</span>
      </div>

      <h1>Don't let your Mac fall asleep.<br><span class="h1-dim">Not even for a second.</span></h1>
      <p class="tagline">The extra energy your Mac needs to never fall asleep.</p>

      <a class="btn" href="https://github.com/nandoolle/Taurine/releases/latest">Download for macOS</a>
      <p class="req">Free and open source · Requires macOS 14.6 or later</p>
    </div>
  </section>
  <!-- Task 4 inserts the screenshots here -->
  <!-- Task 5 inserts the feature cards here -->
</main>

<footer>
  <div class="wrap footer-inner">
    <p>Requires macOS 14.6 or later.</p>
    <p>
      <a href="https://github.com/nandoolle/Taurine">GitHub</a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/nandoolle/Taurine/blob/main/LICENSE">MIT License</a>
    </p>
  </div>
</footer>

<script>
  const can = document.getElementById('can');
  can.addEventListener('click', () => {
    const active = can.classList.toggle('is-active');
    can.setAttribute('aria-pressed', String(active));
  });
</script>
</body>
</html>
